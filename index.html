<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="COCO ALPERI — Portfolio">
  <title>COCO ALPERI — Portfolio</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

  <!-- Intro / logo animation -->
  <div class="intro" id="intro" aria-label="COCO ALPERI">
    <div class="intro-logo">COCO ALPERI</div>
  </div>

  <header class="site-header">
    <a class="logo" href="#home" aria-label="COCO ALPERI home">
      COCO ALPERI
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#work">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <!-- HOME -->
    <section id="home" class="page page-home">
      <div class="hero-video">
        <video 
          id="mainHeroVideo"
          autoplay 
          muted 
          loop 
          playsinline 
          webkit-playsinline
          controls
          preload="auto" 
          class="video-portada"
        >
          <source src="assets/Comp-1.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <!-- WORK -->
    <section id="work" class="page page-work">

      <div class="section-heading">
        <h1>Work</h1>

        <!-- Filtros con data-filter normalizados -->
        <div class="filters" aria-label="Filter projects">
          <button class="filter active" data-filter="all">
            All
          </button>
          <button class="filter" data-filter="Editorial">
            Editorial
          </button>
          <button class="filter" data-filter="Packaging">
            Packaging
          </button>
          <button class="filter" data-filter="Photo editorial">
            Photo editorial
          </button>
          <button class="filter" data-filter="Fashion editorial">
            Fashion editorial
          </button>
          <button class="filter" data-filter="Corporate Identity">
            Corporate identity
          </button>
        </div>
      </div>

      <div class="project-list">

        <!-- Proyecto 1: Editorial -->
        <article class="project" data-category="Editorial" id="project-editorial">
          <a href="projects/project-one.html" class="project-image">
            <img src="assets/portadaCertamen.png" alt="Guardas libro">
          </a>
          <div class="project-info">
            <h2>XIV Certamen de Cuentos y Dibujos sobre Medio Ambiente. Gijón 2025</h2>
            <span>2024</span>
            <span>Editorial</span>
          </div>
        </article>

        <!-- Proyecto 2: Packaging -->
        <article class="project" data-category="Packaging" id="project-packaging">
          <a href="projects/project-two.html" class="project-image">
            <img src="assets/portada1.png" alt="Vinitor">
          </a>
          <div class="project-info">
            <h2>Vinitor</h2>
            <span>2025</span>
            <span>Packaging</span>
          </div>
        </article>

        <!-- Proyecto 3: Dazed (Photo editorial) -->
        <article class="project" data-category="Photo editorial" id="project-dazed">
          <a href="projects/project-three.html" class="project-image">
            <img src="assets/portada3.png" alt="Dazed">
          </a>
          <div class="project-info">
            <h2>Dazed</h2>
            <span>2024</span>
            <span>Photo editorial</span>
          </div>
        </article>

        <!-- Proyecto 4: Les Clodettes (Fashion editorial) -->
        <article class="project" data-category="Fashion editorial" id="project-clodettes">
          <a href="projects/project-four.html" class="project-image">
            <img src="assets/fotoBannerClodettes1.png" alt="Les Clodettes">
          </a>
          <div class="project-info">
            <h2>Les Clodettes</h2>
            <span>2024</span>
            <span>Fashion editorial</span>
          </div>
        </article>

      </div>
    </section>

  </main>

  <script>
    const v = document.getElementById('mainHeroVideo');

    if (v) {
      // 1. Iniciar inmediatamente en mute para superar el bloqueo obligatorio de Safari/Chrome
      v.muted = true;
      v.defaultMuted = true;
      const playPromise = v.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }

      // 2. Activar el audio automáticamente en cuanto el usuario toca la pantalla o hace clic
      const unmuteOnInteraction = () => {
        v.muted = false;
        v.volume = 1.0;
        window.removeEventListener('click', unmuteOnInteraction);
        window.removeEventListener('touchstart', unmuteOnInteraction);
      };

      window.addEventListener('click', unmuteOnInteraction, { once: true });
      window.addEventListener('touchstart', unmuteOnInteraction, { once: true });
    }

    // 3. Filtros de proyectos
    const filterButtons = document.querySelectorAll('.filters .filter');
    const projects = document.querySelectorAll('.project-list .project');

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const selectedFilter = button.getAttribute('data-filter').toLowerCase().trim();

        projects.forEach(project => {
          const category = (project.getAttribute('data-category') || '').toLowerCase().trim();
          if (selectedFilter === 'all' || category === selectedFilter) {
            project.classList.remove('hidden');
          } else {
            project.classList.add('hidden');
          }
        });
      });
    });
  </script>
</body>
</html>
