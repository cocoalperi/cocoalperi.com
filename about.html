<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COCO ALPERI — About</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      padding: 0;
      margin: 0;
    }

    .about-page {
      padding: 170px var(--pad) 80px;
      width: 100%;
    }

    .section-title {
      color: #0055ff;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .lang-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #888888;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    /* Cuadrícula en PC: 360px a la izquierda y el resto a la derecha */
    .top-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: clamp(40px, 6vw, 90px);
      margin-bottom: 80px;
      align-items: start;
    }

    /* Control de ancho para que el texto de Profile no quede excesivamente estirado */
    .profile-right-col {
      max-width: 620px;
    }

    .about-block {
      margin-bottom: 24px;
    }
    .about-block:last-child {
      margin-bottom: 0;
    }

    .lang-es {
      color: #111111;
      font-weight: 400;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .lang-en {
      color: #666666;
      font-weight: 400;
      font-size: 13px;
      line-height: 1.55;
      font-style: italic;
    }

    /* Foto de presentación */
    .profile-photo {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      margin-bottom: 24px;
      background-color: var(--line, #e5e5e5);
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }
